name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv sync
      - run: uv run cfn-typegen --out examples/cfn_types $(grep -v '^#' examples/types.txt)
      - run: uv run ty check
      - run: uv run pytest
