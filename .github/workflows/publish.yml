name: Publish to PyPI

on:
  release:
    types: [published]

jobs:
  test:
    uses: ./.github/workflows/test.yml

  publish:
    needs: test
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - name: Set version from release tag
        run: |
          VERSION="${{ github.ref_name }}"
          VERSION="${VERSION#v}"
          sed -i "s/^version = .*/version = \"$VERSION\"/" pyproject.toml packages/sumo/pyproject.toml
          sed -i "s/^dependencies = \[\"cfn-typed\"\]/dependencies = [\"cfn-typed==$VERSION\"]/" packages/sumo/pyproject.toml
          echo "Set version to $VERSION"

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Generate the types cfn-typed-sumo ships
        run: uv run cfn-typegen --config packages/sumo/cfn-typegen.toml

      - name: Build packages
        run: |
          uv build
          uv build --package cfn-typed-sumo

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
