name: Test

on:
  workflow_call:
    inputs:
      python-versions:
        description: JSON array of Python versions to test
        type: string
        default: '["3.14"]'

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ${{ fromJson(inputs.python-versions) }}
    env:
      UV_PYTHON: ${{ matrix.python-version }}

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install dependencies
        run: uv sync

      - name: Generate the types the examples, tests and cfn-typed-sumo use
        run: |
          uv run cfn-typegen --config examples/cfn-typegen.toml
          uv run cfn-typegen --config packages/sumo/cfn-typegen.toml

      - name: Run type checks
        run: uv run ty check

      - name: Run tests
        run: uv run pytest tests/ packages/sumo/tests/ -v

      - name: Lint the rendered examples with cfn-lint
        # the version is pinned in the dev group of pyproject.toml; errors fail the build, warnings are printed only
        run: uv run cfn-lint --non-zero-exit-code error examples/rendered/*.yaml
