AWSTemplateFormatVersion: '2010-09-09'
Resources:
  ExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - lambda.amazonaws.com
            Action:
              - sts:AssumeRole
      Policies:
        - PolicyName: order-processor-prod-lambda
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:CreateLogGroup
                  - logs:PutLogEvents
                Resource:
                  - !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/order-processor-prod*:*
              - Effect: Allow
                Action:
                  - sqs:ReceiveMessage
                  - sqs:ChangeMessageVisibility
                  - sqs:GetQueueUrl
                  - sqs:DeleteMessage
                  - sqs:GetQueueAttributes
                Resource:
                  - !GetAtt OrderQueue.Arn
              - Effect: Allow
                Action:
                  - dynamodb:BatchWriteItem
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:DeleteItem
                  - dynamodb:DescribeTable
                Resource:
                  - !Sub arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/orders-prod
  Processor:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: order-processor-prod-processor
      Handler: src/processor.handler
      Runtime: nodejs20.x
      Role: !GetAtt ExecutionRole.Arn
      Code:
        S3Bucket: deploy-artifacts
        S3Key: order-processor/prod/package.zip
      MemorySize: 256
      Timeout: 30
      Environment:
        Variables:
          STAGE: prod
          TABLE_NAME: orders-prod
      ReservedConcurrentExecutions: 5
      Tags:
        - Key: Service
          Value: order-processor
        - Key: Stage
          Value: prod
  ProcessorEventSourceMapping:
    Type: AWS::Lambda::EventSourceMapping
    Properties:
      BatchSize: 10
      EventSourceArn: !GetAtt OrderQueue.Arn
      FunctionName: !GetAtt Processor.Arn
  OrderDLQ:
    Type: AWS::SQS::Queue
    Properties:
      Tags:
        - Key: Service
          Value: order-processor
        - Key: Stage
          Value: prod
  OrderQueue:
    Type: AWS::SQS::Queue
    Properties:
      VisibilityTimeout: 180
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt OrderDLQ.Arn
        maxReceiveCount: 3
      Tags:
        - Key: Service
          Value: order-processor
        - Key: Stage
          Value: prod
Outputs:
  QueueUrl:
    Value: !Ref OrderQueue
  DLQUrl:
    Value: !Ref OrderDLQ
