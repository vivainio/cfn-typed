# Public as cfn_typed_sumo.types. Generated by CI and before building; never committed.
# The types the patterns use, plus the core and everyday services (not all of AWS). Add a glob when you want more.
out = "src/cfn_typed_sumo/types"
docs = false
sam = "v1.116.0"  # AWS SAM release the AWS::Serverless::* types come from; bump it to take newer SAM properties
types = [
    # core services
    "AWS::IAM::*",
    "AWS::Lambda::*",
    "AWS::SQS::*",
    "AWS::SNS::*",
    "AWS::S3::*",
    "AWS::KMS::*",
    "AWS::DynamoDB::*",
    "AWS::Logs::*",
    "AWS::Events::*",
    "AWS::SSM::*",
    "AWS::CloudWatch::*",
    # compute, containers, networking and the web
    "AWS::EC2::*",
    "AWS::ECS::*",
    "AWS::ECR::*",
    "AWS::EKS::*",
    "AWS::AutoScaling::*",
    "AWS::ApplicationAutoScaling::*",
    "AWS::ElasticLoadBalancingV2::*",
    "AWS::ApiGateway::*",
    "AWS::ApiGatewayV2::*",
    "AWS::CloudFront::*",
    "AWS::Route53::*",
    "AWS::CertificateManager::*",
    # data, integration and identity
    "AWS::RDS::*",
    "AWS::StepFunctions::*",
    "AWS::Kinesis::*",
    "AWS::KinesisFirehose::*",
    "AWS::SecretsManager::*",
    "AWS::Cognito::*",
    "AWS::CloudFormation::*",
    # AWS SAM (cfn_typed_sumo.types.serverless)
    "AWS::Serverless::*",
]
