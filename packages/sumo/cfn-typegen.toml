# Public as cfn_typed_sumo.types. Generated by CI and before building; never committed.
# The types the patterns use, plus the very core services. Add a type when a pattern starts using it.
out = "src/cfn_typed_sumo/types"
docs = false
types = [
    # core services
    "AWS::IAM::*",
    "AWS::Lambda::*",
    "AWS::SQS::*",
    "AWS::SNS::*",
    "AWS::S3::*",
    "AWS::KMS::*",
    "AWS::DynamoDB::*",
    "AWS::Logs::*",
    "AWS::Events::*",
    "AWS::SSM::*",
    "AWS::CloudWatch::*",
    # types the patterns use outside those
    "AWS::ECR::Repository",
    "AWS::EC2::SecurityGroup",
    "AWS::EC2::SecurityGroupIngress",
    "AWS::ElasticLoadBalancingV2::LoadBalancer",
    "AWS::ElasticLoadBalancingV2::TargetGroup",
    "AWS::ElasticLoadBalancingV2::Listener",
]
