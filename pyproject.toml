[project]
name = "cfn-typed"
version = "0.1.0"
description = "CloudFormation templates as typed Python dicts, with types generated from the registry schemas"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.14"
dependencies = ["typing-extensions>=4.13"]

[project.scripts]
cfn-typegen = "cfn_typed.typegen:main"

[project.optional-dependencies]
yaml = [
    "pyyaml>=6",
]

[dependency-groups]
dev = [
    "ty",
    "pytest",
    "pyyaml>=6.0.3",
    "types-pyyaml>=6.0.12.20260906",
]
docs = ["zensical"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cfn_typed"]

[tool.ty.environment]
python-version = "3.14"
root = ["src", "examples", "."]

[tool.ty.src]
include = ["src", "examples", "tests"]
