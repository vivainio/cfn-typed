[project]
name = "cfn-typed"
version = "0.0.0.dev0"
description = "CloudFormation templates as typed Python dicts, with types generated from the registry schemas"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "NOTICE", "licenses/*"]
requires-python = ">=3.14"
keywords = ["cloudformation", "aws", "typeddict", "typing", "infrastructure-as-code", "codegen"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Code Generators",
    "Typing :: Typed",
]
dependencies = ["typing-extensions>=4.13"]

[project.urls]
Homepage = "https://github.com/vivainio/cfn-typed"
Documentation = "https://vivainio.github.io/cfn-typed/"
Repository = "https://github.com/vivainio/cfn-typed"
Issues = "https://github.com/vivainio/cfn-typed/issues"

[project.scripts]
cfn-typegen = "cfn_typed.typegen:main"
cfn-typed = "cfn_typed.cli:run"

[project.optional-dependencies]
yaml = [
    "pyyaml>=6",
]

[tool.uv.workspace]
members = ["packages/*"]

[dependency-groups]
dev = [
    "cfn-typed-sumo",
    "ty",
    "pytest",
    "pyyaml>=6.0.3",
    "types-pyyaml>=6.0.12.20260906",
    "cfn-lint==1.59.0",  # pinned: a new rule release must not turn CI red
    "aws-sam-translator==1.116.0",  # the oracle for cfn_typed_sumo.sam_expand; same release as the SAM types
]
docs = ["zensical"]

[tool.uv.sources]
cfn-typed-sumo = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cfn_typed"]

[tool.ty.environment]
python-version = "3.14"
root = ["src", "packages/sumo/src", "examples", "."]

[tool.ty.src]
include = ["src", "packages/sumo/src", "packages/sumo/tests", "examples", "tests"]
