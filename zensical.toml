[project]

site_name = "cfn-typed"
site_description = "CloudFormation templates as typed Python dicts, with types generated on demand."
site_author = "Ville Vainio"
site_url = "https://vivainio.github.io/cfn-typed/"
docs_dir = "docs"

copyright = """
Copyright &copy; 2026 Ville Vainio
"""

repo_url = "https://github.com/vivainio/cfn-typed"
repo_name = "vivainio/cfn-typed"

nav = [
  { "Home" = "index.md" },
  { "Getting started" = "getting-started.md" },
  { "The core" = "core.md" },
  { "Intrinsic functions" = "intrinsics.md" },
  { "Comparison" = "comparison.md" },
  { "Patterns" = [
    { "Overview" = "patterns/index.md" },
    { "Lambda execution role" = "patterns/lambda-role.md" },
    { "Queue with a dead-letter queue" = "patterns/queue-with-dlq.md" },
    { "SQS-triggered Lambda" = "patterns/sqs-trigger.md" },
    { "Load balancer building blocks" = "patterns/load-balancer.md" },
    { "One load balancer, several ports" = "patterns/web-entrypoint.md" },
    { "Encrypted storage" = "patterns/storage.md" },
    { "Publishing values through SSM" = "patterns/publishing.md" },
    { "Parameters as variables" = "patterns/parameters.md" },
    { "CDK L2 constructs as patterns" = "patterns/cdk-l2.md" },
    { "Composing fragments" = "patterns/composing.md" },
    { "A complete stack" = "patterns/complete-stack.md" },
  ] },
  { "Permission names" = "permissions.md" },
  { "Policy statements" = "policy.md" },
  { "Grants (opinion layer)" = "grants.md" },
  { "Rendered examples" = [
    { "Overview" = "rendered/index.md" },
    { "Minimal stack" = "rendered/minimal.md" },
    { "Web stack" = "rendered/web-stack.md" },
    { "SQS worker" = "rendered/sqs-worker.md" },
    { "Data platform (producer)" = "rendered/data-platform.md" },
    { "Data platform (consumer)" = "rendered/data-consumer.md" },
    { "Intrinsic functions" = "rendered/intrinsics.md" },
  ] },
  { "Testing with golden templates" = "testing.md" },
  { "Distributing patterns" = "distributing.md" },
  { "The generator" = "generator.md" },
  { "Reference" = "reference/index.md" },
]

[project.theme]
language = "en"
features = [
  "content.code.annotate",
  "content.code.copy",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.path",
  "navigation.sections",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
]

[project.theme.icon]
logo = "lucide/blocks"

[[project.theme.palette]]
scheme = "default"
primary = "indigo"
accent = "deep-orange"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
scheme = "slate"
primary = "indigo"
accent = "deep-orange"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/vivainio/cfn-typed"

[project.markdown_extensions.admonition]
[project.markdown_extensions.attr_list]
[project.markdown_extensions.md_in_html]
[project.markdown_extensions.toc]
permalink = true
[project.markdown_extensions.pymdownx.details]
[project.markdown_extensions.pymdownx.emoji]
emoji_generator = "zensical.extensions.emoji.to_svg"
emoji_index = "zensical.extensions.emoji.twemoji"
[project.markdown_extensions.pymdownx.highlight]
anchor_linenums = true
line_spans = "__span"
pygments_lang_class = true
[project.markdown_extensions.pymdownx.inlinehilite]
[project.markdown_extensions.pymdownx.snippets]
base_path = ["."]
check_paths = true
[project.markdown_extensions.pymdownx.superfences]
[project.markdown_extensions.pymdownx.tabbed]
alternate_style = true
